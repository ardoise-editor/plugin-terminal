[package]
name = "ardoise-terminal"
version = "1.0.1"
edition = "2021"
rust-version = "1.90"
publish = false
description = "The Terminal plugin of Ardoise"
license = "MIT"

[[bin]]
name = "terminal"
path = "src/main.rs"

[dependencies]
ardoise-plugin = { path = "../plugin-sdk" }
serde_json = "1"
portable-pty = "0.9.0"
vt100 = "0.18.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
